# PowerShield-FL master configuration.
# Mode presets below override the per-module YAML files when --mode is used.
experiment:
  seed: 42
  mode: quick
  output_dir: results
  save_models: true
  verbose: true

evaluation:
  threshold: 0.5
  tune_threshold: true
  max_test_samples: 8000
  bootstrap_ci: true
  n_bootstrap: 200
  positive_label: 1

model:
  name: lightweight
  hidden: [64, 32]
  dropout: 0.2
  cnn_lstm:
    conv_channels: 16
    lstm_hidden: 32
    kernel_size: 3
    dropout: 0.2
    epochs: 6
    batch_size: 128
    learning_rate: 0.001

communication:
  compression: true
  method: quantize          # final default: measured same byte reduction as topk_quantize with better validation utility
  topk_fraction: 0.2
  quant_bits: 8
  compress_broadcast: true

explainability:
  shap_samples: 40
  shap_background: 30
  shap_nsamples: 100
  permutation_repeats: 5
  permutation_max_rows: 1500
  local_explanations: 10

detection:
  uncertain_margin: 0.15
  consumer_positive_window_ratio: 0.4

modes:
  quick:
    data.synthetic.consumers: 240
    data.synthetic.days: 180
    data.synthetic.theft_rate: 0.15
    clients.num_clients: 5
    federated.rounds: 8
    federated.local_epochs: 2
    privacy.noise_multiplier: 0.001
    evaluation.max_test_samples: 4000
    experiments.seeds: [42]
    experiments.privacy_sweep: [0.0, 0.001, 0.003, 0.006]
    experiments.scalability_clients: [2, 5, 10]
    experiments.cnn_lstm_enabled: true
  full:
    data.synthetic.consumers: 600
    data.synthetic.days: 365
    data.synthetic.theft_rate: 0.12
    clients.num_clients: 10
    federated.rounds: 25
    federated.local_epochs: 2
    evaluation.max_test_samples: 12000
    experiments.seeds: [42, 123, 2026]
    experiments.privacy_sweep: [0.0, 0.001, 0.003, 0.006]
    experiments.scalability_clients: [2, 5, 10, 20]
    experiments.cnn_lstm_enabled: true
